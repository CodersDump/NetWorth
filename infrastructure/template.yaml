AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NetWorth - badminton tournament & ranking app.
  Resources: DynamoDB (Players, Groups, Matches, Tournaments), Lambda (Python),
  API Gateway, S3 static site. Lambda code is packaged from backend/lambdas/*
  via `aws cloudformation package` (required once functions exceed the 4KB
  inline ZipFile limit).

Parameters:
  AppName:
    Type: String
    Default: networth
  ConfirmationCode:
    Type: String
    NoEcho: true
    Description: Secret required for destructive operations (deletes). Set in GitHub repo secrets, never committed.
  FinanceViewKey:
    Type: String
    NoEcho: true
    Description: Secret required to read/write finance data. Set in GitHub repo secrets, never committed.
  DeploymentTimestamp:
    Type: String
    Default: 'initial'
    Description: >
      Pass a new value (e.g. a timestamp) on every deploy so the
      ApiDeployment resource always replaces itself and captures any
      newly added API Gateway resources/methods.

Resources:

  # ---------- DynamoDB ----------

  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-players'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: player_id
          AttributeType: S
      KeySchema:
        - AttributeName: player_id
          KeyType: HASH

  GroupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-groups'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: group_id
          AttributeType: S
      KeySchema:
        - AttributeName: group_id
          KeyType: HASH

  MatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-matches'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: match_id
          AttributeType: S
      KeySchema:
        - AttributeName: match_id
          KeyType: HASH

  TournamentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-tournaments'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tournament_id
          AttributeType: S
      KeySchema:
        - AttributeName: tournament_id
          KeyType: HASH

  FinanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-finance'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: record_id
          AttributeType: S
      KeySchema:
        - AttributeName: record_id
          KeyType: HASH

  # Claim requests: a player asking to be linked to an account, pending a
  # SuperAdmin decision. Deliberately its own table rather than a field on
  # the player record - several people can request the same player, and a
  # decided request is an audit trail worth keeping after the fact.
  ClaimRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-claim-requests'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH

  ProgressHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-progress-history'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: history_id
          AttributeType: S
      KeySchema:
        - AttributeName: history_id
          KeyType: HASH

  # Temporary, group-scoped rosters ("7-8 PM" / "8-9 PM") that overlay a
  # real group without touching its actual membership - 2026-08-29, see
  # BACKLOG.md and the Sessions note atop groups/index.py. Deliberately its
  # own table rather than living in GroupsTable: sessions are ephemeral and
  # manually closed (soft-deleted via is_open, never hard-deleted), and
  # keeping them out of GroupsTable means every existing group-scan-based
  # listing/membership check in that lambda stays untouched.
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-sessions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH

  # Shared quick-tap/voice match queue, 2026-08-30 - previously each
  # browser kept its own not-yet-sent queue purely in localStorage,
  # invisible to anyone else recording the same session, which is exactly
  # how the same match ended up queued twice by two different people.
  # TimeToLiveSpecification auto-expires an abandoned item (someone queues
  # a match, then never taps "Send all" and closes the tab) without a
  # cleanup job - DynamoDB does the sweep for free. The Lambda ALSO filters
  # on expires_at defensively at read time (list_queue), since TTL deletes
  # are background/eventually-consistent and can lag by hours.
  QueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-queue'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: queue_id
          AttributeType: S
      KeySchema:
        - AttributeName: queue_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ---------- IAM Role for Lambda ----------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${AppName}-lambda-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'
              # Approving a match edit/delete request re-invokes the matches
              # function to run the real change (and its rating recompute),
              # rather than reimplementing that logic in the players Lambda.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}-matches'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt PlayersTable.Arn
                  - !GetAtt GroupsTable.Arn
                  - !GetAtt SessionsTable.Arn
                  - !GetAtt MatchesTable.Arn
                  - !GetAtt TournamentsTable.Arn
                  - !GetAtt ProgressHistoryTable.Arn
                  - !GetAtt FinanceTable.Arn
                  - !GetAtt ClaimRequestsTable.Arn
                  - !GetAtt QueueTable.Arn
              # Approving a claim has to write custom:player_id onto the
              # REQUESTER'S account, which only an admin API can do - the
              # self-service updateAttributes call needs their session.
              # Scoped to this pool only, and to the two calls needed.
              - Effect: Allow
                Action:
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminDeleteUserAttributes
                  - cognito-idp:AdminGetUser
                  # Deleting a player removes its linked login too, so the
                  # address is free to sign up again rather than being
                  # stuck as an orphaned account.
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:ListUsers
                Resource: !GetAtt UserPool.Arn
              # Only the uploads/ prefix, and only writes. The Lambda hands
              # out presigned PUTs; it never needs to read or delete, and it
              # must not be able to touch index.html in the same bucket.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  # Needed to evict a player's oldest custom image once
                  # they go past the keep-limit. Still confined to
                  # uploads/, so index.html in the same bucket is safe.
                  - s3:DeleteObject
                Resource: !Sub '${WebsiteBucket.Arn}/uploads/*'

  # ---------- Cognito (Epic 1 - foundation only, not yet wired to any
  # route or the live frontend. Standalone and isolated by design; nothing
  # existing changes as a result of these resources existing.) ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AppName}-users'
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      # ESSENTIALS (not the default LITE tier) is required for
      # PasswordHistorySize below - owner report, 2026-08-24: "i was able to
      # forget password and use my old password again. it should not allow
      # that as well." Cost impact for a club-sized user base is
      # effectively nil (Essentials is free for the first 10,000 MAU,
      # $0.015/MAU after - see https://aws.amazon.com/cognito/pricing/).
      UserPoolTier: ESSENTIALS
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 30
          # Blocks reuse of any of the last 3 passwords - applies to every
          # password-setting path Cognito has (forgot-password/
          # ConfirmForgotPassword, ChangePassword, and the admin
          # AdminSetUserPassword flow), not just one of them.
          PasswordHistorySize: 3
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: player_id
          AttributeDataType: String
          Mutable: true
          # Custom attribute linking a Cognito identity to an existing
          # PlayersTable row. Set at account-creation time for pre-existing
          # roster members (Epic 2's bulk provisioning script); set via a
          # claim step for anyone new (Epic 6).

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AppName}-web-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # No client secret - this is a browser SPA, a secret can't be kept
      # safe in JS anyway (same reasoning as never embedding AWS keys
      # client-side).
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: SuperAdmin
      UserPoolId: !Ref UserPool
      Description: >-
        Pool-wide override role (Adi, and any future co-admin). Bypasses
        per-group owner/admin checks entirely once wired up in Epic 4.
        Deliberately NOT the same mechanism as club-group ownership, which
        lives in GroupsTable instead - see README for why.

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${AppName}-cognito-authorizer'
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref RestApi
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt UserPool.Arn

  # ---------- Lambda functions (packaged from backend/lambdas/*) ----------

  WhoamiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-whoami'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Default is 128 MB, which left only ~30 MB of headroom on the
      # full-table scans (attendance, diversity, hall of fame,
      # progress history). Going over kills the runtime, and that
      # surfaces as a gateway 500 with no CORS headers rather than
      # as a Lambda error - which is why nothing showed in the logs.
      # Lambda scales CPU with memory too, so this also cuts the
      # multi-second calls right down for near-identical cost.
      MemorySize: 512
      Timeout: 10
      Code: ../backend/lambdas/whoami
      # No env vars needed - this function only echoes token claims, it
      # never touches DynamoDB. Reuses the shared execution role purely
      # for convenience (no new IAM resource needed); it doesn't use any
      # of that role's DynamoDB permissions.


  RegisterPlayerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-register-player'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Default is 128 MB, which left only ~30 MB of headroom on the
      # full-table scans (attendance, diversity, hall of fame,
      # progress history). Going over kills the runtime, and that
      # surfaces as a gateway 500 with no CORS headers rather than
      # as a Lambda error - which is why nothing showed in the logs.
      # Lambda scales CPU with memory too, so this also cuts the
      # multi-second calls right down for near-identical cost.
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
      Code: ../backend/lambdas/register_player

  PlayersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-players'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Default is 128 MB, which left only ~30 MB of headroom on the
      # full-table scans (attendance, diversity, hall of fame,
      # progress history). Going over kills the runtime, and that
      # surfaces as a gateway 500 with no CORS headers rather than
      # as a Lambda error - which is why nothing showed in the logs.
      # Lambda scales CPU with memory too, so this also cuts the
      # multi-second calls right down for near-identical cost.
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
          CLAIM_REQUESTS_TABLE: !Ref ClaimRequestsTable
          GROUPS_TABLE: !Ref GroupsTable
          USER_POOL_ID: !Ref UserPool
          UPLOADS_BUCKET: !Ref WebsiteBucket
          CONFIRMATION_CODE: !Ref ConfirmationCode
          MATCHES_FUNCTION: !Sub '${AppName}-matches'
          # Added for merge_players() only - the shared LambdaExecutionRole
          # already grants this function full CRUD on every table below,
          # so these four env vars are the entire IAM footprint of the
          # merge-duplicate-profiles feature. No policy changes needed.
          MATCHES_TABLE: !Ref MatchesTable
          SESSIONS_TABLE: !Ref SessionsTable
          FINANCE_TABLE: !Ref FinanceTable
          TOURNAMENTS_TABLE: !Ref TournamentsTable
      Code: ../backend/lambdas/players

  GroupsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-groups'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Default is 128 MB, which left only ~30 MB of headroom on the
      # full-table scans (attendance, diversity, hall of fame,
      # progress history). Going over kills the runtime, and that
      # surfaces as a gateway 500 with no CORS headers rather than
      # as a Lambda error - which is why nothing showed in the logs.
      # Lambda scales CPU with memory too, so this also cuts the
      # multi-second calls right down for near-identical cost.
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          GROUPS_TABLE: !Ref GroupsTable
          PLAYERS_TABLE: !Ref PlayersTable
          SESSIONS_TABLE: !Ref SessionsTable
          CONFIRMATION_CODE: !Ref ConfirmationCode
      Code: ../backend/lambdas/groups

  FinanceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-finance'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Default is 128 MB, which left only ~30 MB of headroom on the
      # full-table scans (attendance, diversity, hall of fame,
      # progress history). Going over kills the runtime, and that
      # surfaces as a gateway 500 with no CORS headers rather than
      # as a Lambda error - which is why nothing showed in the logs.
      # Lambda scales CPU with memory too, so this also cuts the
      # multi-second calls right down for near-identical cost.
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          FINANCE_TABLE: !Ref FinanceTable
          PLAYERS_TABLE: !Ref PlayersTable
          MATCHES_TABLE: !Ref MatchesTable
          GROUPS_TABLE: !Ref GroupsTable
          CONFIRMATION_CODE: !Ref ConfirmationCode
          FINANCE_VIEW_KEY: !Ref FinanceViewKey
      Code: ../backend/lambdas/finance

  MatchesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-matches'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Default is 128 MB, which left only ~30 MB of headroom on the
      # full-table scans (attendance, diversity, hall of fame,
      # progress history). Going over kills the runtime, and that
      # surfaces as a gateway 500 with no CORS headers rather than
      # as a Lambda error - which is why nothing showed in the logs.
      # Lambda scales CPU with memory too, so this also cuts the
      # multi-second calls right down for near-identical cost.
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          MATCHES_TABLE: !Ref MatchesTable
          PLAYERS_TABLE: !Ref PlayersTable
          TOURNAMENTS_TABLE: !Ref TournamentsTable
          GROUPS_TABLE: !Ref GroupsTable
          PROGRESS_HISTORY_TABLE: !Ref ProgressHistoryTable
          CONFIRMATION_CODE: !Ref ConfirmationCode
          QUEUE_TABLE: !Ref QueueTable
      Code: ../backend/lambdas/matches

  ProgressSchedulerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-progress-scheduler'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Default is 128 MB, which left only ~30 MB of headroom on the
      # full-table scans (attendance, diversity, hall of fame,
      # progress history). Going over kills the runtime, and that
      # surfaces as a gateway 500 with no CORS headers rather than
      # as a Lambda error - which is why nothing showed in the logs.
      # Lambda scales CPU with memory too, so this also cuts the
      # multi-second calls right down for near-identical cost.
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          MATCHES_TABLE: !Ref MatchesTable
          PLAYERS_TABLE: !Ref PlayersTable
          GROUPS_TABLE: !Ref GroupsTable
          PROGRESS_HISTORY_TABLE: !Ref ProgressHistoryTable
      Code: ../backend/lambdas/progress_scheduler

  ProgressSchedulerDailyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AppName}-progress-scheduler-daily'
      Description: Runs daily to lock in last week/month/year's progress badges once each period completes
      ScheduleExpression: 'cron(5 0 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProgressSchedulerFunction.Arn
          Id: ProgressSchedulerTarget

  ProgressSchedulerEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProgressSchedulerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProgressSchedulerDailyRule.Arn

  TournamentsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-tournaments'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Default is 128 MB, which left only ~30 MB of headroom on the
      # full-table scans (attendance, diversity, hall of fame,
      # progress history). Going over kills the runtime, and that
      # surfaces as a gateway 500 with no CORS headers rather than
      # as a Lambda error - which is why nothing showed in the logs.
      # Lambda scales CPU with memory too, so this also cuts the
      # multi-second calls right down for near-identical cost.
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          TOURNAMENTS_TABLE: !Ref TournamentsTable
          GROUPS_TABLE: !Ref GroupsTable
          PLAYERS_TABLE: !Ref PlayersTable
          MATCHES_TABLE: !Ref MatchesTable
          CONFIRMATION_CODE: !Ref ConfirmationCode
      Code: ../backend/lambdas/tournaments

  # ---------- API Gateway ----------

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AppName}-api'

  # /register

  RegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: register

  RegisterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RegisterResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterPlayerFunction.Arn}/invocations'

  RegisterOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RegisterResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  RegisterFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RegisterPlayerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*'

  # /players and /players/{player_id}

  PlayersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: players

  ListPlayersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PlayersFunction.Arn}/invocations'

  PlayersOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,GET'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Sibling of PlayerIdResource under PlayersResource, not a child of it -
  # "merge" is a literal path segment here, not a player_id value, so it
  # needs its own resource rather than colliding with the {player_id}
  # greedy-looking-but-actually-exact-match path. API Gateway resolves an
  # exact literal segment ahead of a {param} sibling, so /players/merge
  # never gets swallowed by /players/{player_id}.
  PlayersMergeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref PlayersResource
      PathPart: merge

  MergePlayersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersMergeResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PlayersFunction.Arn}/invocations'

  PlayersMergeOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersMergeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  PlayerIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref PlayersResource
      PathPart: '{player_id}'

  DeletePlayerMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayerIdResource
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PlayersFunction.Arn}/invocations'

  UpdatePlayerMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayerIdResource
      HttpMethod: PUT
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PlayersFunction.Arn}/invocations'

  PlayerIdOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
