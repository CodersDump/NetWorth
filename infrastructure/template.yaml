  # No separate Lambda permission needed here - MatchesFunctionPermission
  # (defined earlier) already grants apigateway.amazonaws.com invoke
  # access via a '/*/*' wildcard covering every method/path on this API.

  # Shared quick-tap/voice match queue (2026-08-30) - was purely a
  # per-browser localStorage array until now, invisible to anyone else
  # recording the same session, which is exactly how the same match ended
  # up queued twice by two different people. POST adds an item (any group
  # member); GET lists a group's current queue (polled by the frontend
  # only while the Record tab is open and visible - same defensive pattern
  # already used for tournament schedule/auction polling); DELETE removes
  # one item (sent successfully, or someone decided not to add it - any
  # group member may remove any item, same "anyone in the group can add
  # or remove" trust level Sessions already established). See
  # list_queue/create_queue_item/delete_queue_item in matches/index.py.
  QueueResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: queue

