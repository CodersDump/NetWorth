  # /tournament-draft and /tournament-draft/{proxy+} - manual-mode (leaders
  # + pools + auction) routes, same TournamentsFunction as above but on a
  # SEPARATE Cognito-authorized resource tree, not bolted onto
  # /tournaments{proxy+} (that resource is AuthorizationType: NONE, so
  # requestContext.authorizer.claims is never populated there - every
  # manual-draft write needs real caller identity: organizer role checks,
  # and later "which leader is this bid from"). Same reasoning as the
  # existing /create-tournament resource, just as a {proxy+} tree since
  # manual-draft mode needs many sub-actions per tournament_id rather than
  # one flat POST.

