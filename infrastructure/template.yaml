      StageName: prod

  # ---------- S3 static site ----------

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-site-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'

  # ---------- CloudFront (HTTPS in front of the S3 website) ----------

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3WebsiteOrigin
            DomainName: !Select [2, !Split ['/', !GetAtt WebsiteBucket.WebsiteURL]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 60
          MaxTTL: 300

Outputs:
  WebsiteUrl:
    Description: Shareable link for your teammates
    Value: !GetAtt WebsiteBucket.WebsiteURL

  CloudFrontUrl:
    Description: HTTPS shareable link (use this one - works on mobile)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  ApiUrl:
    Description: Base API URL (used by frontend JS)
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  RestApiId:
    Description: Used by the workflow to force a fresh API Gateway deployment
    Value: !Ref RestApi

  UserPoolId:
    Description: Cognito User Pool ID (used by the auth test page and provisioning script)
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito App Client ID (used by the frontend/test page - not secret)
    Value: !Ref UserPoolClient

  PlayersTableName:
    Value: !Ref PlayersTable

  GroupsTableName:
    Value: !Ref GroupsTable

  MatchesTableName:
    Value: !Ref MatchesTable

  TournamentsTableName:
    Value: !Ref TournamentsTable
