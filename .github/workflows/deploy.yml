name: Deploy NetWorth

# Prod NEVER deploys on a push to main. Merging to main only STAGES code as
# "ready to ship" - it does not ship it. Prod deploys only when YOU trigger it:
#   - the "Run workflow" button (workflow_dispatch), or
#   - publishing a GitHub Release, or pushing a version tag (v*).
#
# Code reaches main only through a PR from staging, and branch protection
# blocks that PR's merge button until the staging deploy is green. So anything
# on main is already staging-verified; this workflow just ships it on demand.
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags: ['v*']

jobs:
  # Safety: only ship commits that actually reached main (i.e. went through
  # the staging->main PR gate). Blocks deploying a stray tag cut off some
  # commit that was never merged to main.
  on-main-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require this commit to be on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is on main - it passed the staging->main PR gate."
          else
            echo "::error::This commit is not on main. Only release commits that were merged to main (via a staging-verified PR) can deploy to prod."
            exit 1
          fi

  deploy:
    needs: on-main-gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure artifacts bucket exists
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="networth-artifacts-$ACCOUNT_ID"
          echo "ARTIFACTS_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists"
          else
            aws s3api create-bucket --bucket "$BUCKET" --region "${{ secrets.AWS_REGION }}" \
              $( [ "${{ secrets.AWS_REGION }}" != "us-east-1" ] && echo "--create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}" )
          fi

      - name: Package CloudFormation template (zips + uploads Lambda code)
        run: |
          aws cloudformation package \
            --template-file infrastructure/template.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file packaged-template.yaml

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file packaged-template.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --stack-name networth-app \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              DeploymentTimestamp=$(date +%s) \
              ConfirmationCode="${{ secrets.CONFIRMATION_CODE }}" \
              FinanceViewKey="${{ secrets.FINANCE_VIEW_KEY }}"

      - name: Force fresh API Gateway deployment
        run: |
          REST_API_ID=$(aws cloudformation describe-stacks \
            --stack-name networth-app \
            --query "Stacks[0].Outputs[?OutputKey=='RestApiId'].OutputValue" \
            --output text)
          aws apigateway create-deployment --rest-api-id $REST_API_ID --stage-name prod

      - name: Get API URL from stack outputs
        id: stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name networth-app \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name networth-app \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)
          echo "user_pool_id=$USER_POOL_ID" >> "$GITHUB_OUTPUT"
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name networth-app \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text)
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Inject API URL and Cognito config into frontend
        run: |
          sed -i "s#https://REPLACE_ME.execute-api.REGION.amazonaws.com/prod#${{ steps.stack-outputs.outputs.api_url }}#g" frontend/index.html
          sed -i "s#REPLACE_ME_USER_POOL_ID#${{ steps.stack-outputs.outputs.user_pool_id }}#g" frontend/index.html
          sed -i "s#REPLACE_ME_CLIENT_ID#${{ steps.stack-outputs.outputs.client_id }}#g" frontend/index.html

      - name: Sync frontend to S3
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name networth-app \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" \
            --output text | sed -E 's#http://([^.]+)\..*#\1#')
          aws s3 cp frontend/index.html s3://$BUCKET_NAME/index.html
          # css/ and js/ were split out of index.html. Explicit cp (never
          # `sync --delete`) because this bucket ALSO holds user uploads
          # under uploads/ - a --delete would wipe every uploaded cosmetic.
          aws s3 cp frontend/css/ s3://$BUCKET_NAME/css/ --recursive
          aws s3 cp frontend/js/  s3://$BUCKET_NAME/js/  --recursive

      - name: Invalidate CloudFront cache
        run: |
          DIST_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name networth-app \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text | sed -E 's#https://##')
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='$DIST_DOMAIN'].Id" \
            --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"